name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Local turbo cache only; no remote cache.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint:all typecheck build test size check-exports
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/core/dist/agentlens.mjs
            packages/core/dist/agentlens.iife.js
            packages/core/dist/agentlens.d.ts

  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness/runners-py
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
