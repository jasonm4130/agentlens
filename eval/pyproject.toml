[project]
name = "agentlens-eval"
version = "0.0.0"
description = "Offline eval and release gate for agentlens (architecture 7.4-7.6). Not published."
requires-python = ">=3.12"
dependencies = ["polars>=1.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
